[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pace"
dynamic = ["version"]
description = "Pace your Claude plan limits across the week: daily budget, 5-hour and weekly meters, sessions per week."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ElishaPervez" }]
keywords = ["claude", "claude-code", "usage", "rate-limits", "statusline", "tui", "dashboard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
claude-pace = "claude_pace:main"

[project.urls]
Homepage = "https://github.com/ElishaPervez/claude-pace"
Issues = "https://github.com/ElishaPervez/claude-pace/issues"
Releases = "https://github.com/ElishaPervez/claude-pace/releases"

[tool.setuptools]
py-modules = ["claude_pace"]

[tool.setuptools.dynamic]
version = { attr = "claude_pace.VERSION" }
